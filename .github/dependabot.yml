# Weekly dependency updates (#698), one grouped pull request per ecosystem so
# they can be read and merged together. Security updates still arrive on
# their own as soon as GitHub knows of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    groups:
      relay:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    groups:
      android:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /installer/windows/tray
    schedule:
      interval: weekly
      day: monday
    groups:
      tray:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/postbox"]
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
