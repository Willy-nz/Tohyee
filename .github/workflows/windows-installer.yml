name: Windows installer

# Builds TohyeeSetup-<version>.exe on Windows, installs it on the runner and
# checks it end to end (installer/windows/test-install.ps1). On a v* tag it
# also attaches the installer to the GitHub release.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET (builds the Tohyee server app)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Build the installer
        run: ./installer/windows/build.ps1

      - name: Pictures of the server app (sample data, as on Windows)
        timeout-minutes: 5
        continue-on-error: true
        env:
          TOHYEE_DEMO_TRANSITIONS: "1"
          TOHYEE_DEMO_DELAY_MS: "150"
        run: |
          $exe = Join-Path $PWD 'dist\windows\stage\tray\TohyeeTray.exe'
          $shots = Join-Path $PWD 'dist\windows\tray-screenshots'
          $p = Start-Process -FilePath $exe -ArgumentList @('--demo-screenshots', "`"$shots`"") -Wait -PassThru
          Write-Host "Exit code $($p.ExitCode)"
          Get-ChildItem $shots | Select-Object Name, Length | Format-Table | Out-Host

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-screenshots
          path: dist/windows/tray-screenshots

      - name: Install and test it on this machine
        run: ./installer/windows/test-install.ps1

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: TohyeeSetup
          path: |
            dist/windows/TohyeeSetup-*.exe
            dist/windows/TohyeeSetup-*.exe.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 30 }
          }
          gh release upload $tag (Get-ChildItem dist/windows/TohyeeSetup-*).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading to the release failed.' }
