services:
  postgres:
    image: postgres:17
    container_name: toeyee-postgres
    environment:
      POSTGRES_DB: toeyee
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - toeyee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d toeyee"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: toeyee-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - toeyee_redis_data:/data

volumes:
  toeyee_postgres_data:
  toeyee_redis_data:
